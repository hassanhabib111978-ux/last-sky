name: LAST SKY Android Test APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Export Godot Android APK
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android Debug
          export_debug: true
          cache: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAST-SKY-Android-Test
          path: build/last-sky-debug.apk
          if-no-files-found: error
