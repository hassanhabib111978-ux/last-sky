name: LAST SKY Android Test APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager             "platform-tools"             "platforms;android-35"             "build-tools;35.0.1"

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot/godot.zip"             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"

      - name: Install Godot Android export templates
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot/templates"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot/templates.tpz"             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R "$RUNNER_TEMP/godot/templates/templates/."             "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Validate Godot project
        shell: bash
        run: |
          "$RUNNER_TEMP/godot/godot" --headless --path . --editor --quit

      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p build
          "$RUNNER_TEMP/godot/godot" --headless --path .             --export-debug "Android Debug" build/last-sky-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          test -s build/last-sky-debug.apk
          ls -lh build/last-sky-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAST-SKY-Android-Test
          path: build/last-sky-debug.apk
          if-no-files-found: error
